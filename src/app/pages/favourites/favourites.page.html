<ion-header>
  <ion-toolbar>
    <ion-title>Favourites</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="goHome()">🏠</ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card *ngFor="let movie of favourites">

    <img
      *ngIf="movie.poster_path"
      [src]="getPosterUrl(movie.poster_path)"
      alt="Movie poster">

    <p *ngIf="!movie.poster_path">
      No image
    </p>

    <ion-card-header>
      <ion-card-title>
        {{ movie.title }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      {{ movie.overview }}
    </ion-card-content>

    <ion-button expand="block" (click)="openMovie(movie)">
      Details
    </ion-button>

    <ion-button expand="block" color="danger" (click)="removeFavourite(movie.id)">
      Remove Favourite
    </ion-button>

  </ion-card>

</ion-content>
